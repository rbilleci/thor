apiVersion: thor/v1alpha1
kind: AgentPack
metadata:
  name: thor
  version: 0.1.0
  description: Thor Software Development Runtime
spec:
  targets: [ claude, codex ]
  models:
    lens-reviewer:
      description: Lens Reviewer
      targets:
        claude:
          model: haiku
          effort: high
        codex:
          model: gpt-5.6-luna
          effort: high
    assurance-scope-selector:
      description: Assurance Scope Selector
      targets:
        claude:
          model: sonnet
          effort: high
        codex:
          model: gpt-5.6-terra
          effort: high
    slicer:
      description: Workhorse
      targets:
        claude:
          model: sonnet
          effort: xhigh
        codex:
          model: gpt-5.6-terra
          effort: xhigh
    systemic-assurance-reviewer:
      description: Highest capability for systemic assurance and implementation ownership.
      targets:
        claude:
          model: opus
          effort: xhigh
        codex:
          model: gpt-5.6-sol
          effort: xhigh
    design-contract-resolver:
      description: Design Contract Resolver
      targets:
        claude:
          model: opus
          effort: high
        codex:
          model: gpt-5.6-sol
          effort: high
    architect:
      description: Architect
      targets:
        claude:
          model: opus
          effort: xhigh
        codex:
          model: gpt-5.6-sol
          effort: xhigh
