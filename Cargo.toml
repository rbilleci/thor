[workspace]
members = [
    "crates/thor-core",
    "crates/thor-build",
    "crates/thor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/acme/thor"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
fs2 = "0.4"
hex = "0.4"
jsonschema = "0.37"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
toml = "0.9"
walkdir = "2.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
